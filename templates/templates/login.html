{% extends "base.html" %}
{% block title %}Login - SICCA{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto">
  <div class="card">
    <div style="text-align:center;margin-bottom:25px">
      <div style="font-size:48px">&#128269;</div>
      <h1 style="color:#60a5fa;font-weight:300;margin-top:10px">SICCA</h1>
      <p style="color:var(--text-light);margin-top:5px">Sign in to continue</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username" class="required">Username</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" class="required">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%">Sign In</button>
    </form>
    <p style="color:var(--text-light);font-size:12px;margin-top:20px;text-align:center">
      Default admin credentials are printed to the server log on first run.
      Change them immediately after first login.
    </p>
  </div>
</div>
{% endblock %}
